# 服务端「版本清单」示例。把这份文件放到 UpdateURL 指向的位置即可。
# 纯文本 key=value;# / ; 开头是注释,[section] 行会被忽略。
#
# Version 必填,支持 1.2.3 / v1.2 / 1.2.3-beta.2 这类写法。
# URL 必填:绝对地址直接下载;写相对文件名则按本清单所在目录展开
#           (清单地址带 ?token=... 之类的签名参数也能正确取目录)。
# Size 建议填:客户端按 Range 分段下载时用它算总长与进度。
# Sha256 强烈建议填:下载完会流式校验,不符的包直接丢弃。
#           URL 走明文 http 时这一项**必须**填,否则清单会被拒绝。
# 更新包必须是新的 maliang.exe(合法 PE 映像,CPU 架构要与目标机器一致);
# 目前不解压 zip,需要多文件时请自行在服务端打包成单个安装器。
# 服务端最好支持 HTTP Range(返回 206 + Content-Range),这样断线能续传;
# 不支持时客户端会退回一次性整包下载,并在失败时明确提示「需重新完整下载」。
# Notes 支持 \n 表示换行,会显示在「检查更新」窗口里。
#
# 生成示例(Windows PowerShell):
#   (Get-FileHash .\maliang.exe -Algorithm SHA256).Hash.ToLower()
#   (Get-Item .\maliang.exe).Length

[update]
Version=0.3.0
URL=maliang-0.3.0.exe
Size=18874368
Sha256=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
Notes=修复若干问题\n改进大图库的滚动流畅度
